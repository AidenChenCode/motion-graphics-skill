<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Motion Graphics — 代码生成动效（WebGL2 + Canvas2D + Web Audio）</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #stage { position: absolute; left: 50%; top: 50%; transform-origin: 0 0; background: #000; }
  #stage canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  #play { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
          font: 600 22px/1 "Avenir Next", "Helvetica Neue", Arial, sans-serif; letter-spacing: 6px;
          color: #fff; background: #1F5EFF; border: 0; border-radius: 6px; padding: 22px 44px; cursor: pointer; }
  #play:hover { filter: brightness(1.15); }
  body.export #play { display: none; }
  body.export #stage { left: 0; top: 0; transform: none !important; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl"></canvas>
  <canvas id="ui"></canvas>
  <button id="play">▶ PLAY</button>
</div>
<!-- 加载顺序固定：配置 → 引擎 → 分镜 → 配乐（都是经典脚本，file:// 下可直接打开） -->
<script src="spec.js"></script>
<script src="engine.js"></script>
<script src="scenes.js"></script>
<script src="score.js"></script>
<script>document.getElementById('play').style.background = SPEC.colors.primary;</script>
</body>
</html>
